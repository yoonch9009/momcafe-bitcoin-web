name: Merge legacy history once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/merge-legacy-history-once.yml

permissions:
  contents: write

jobs:
  merge-legacy-history:
    if: github.repository == 'yoonch9009/momcafe-bitcoin-web'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge legacy repository history without changing current files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add legacy https://github.com/yoonch9009/momcafe_bitcoin.git
          git fetch legacy main

          legacy_sha="46cbe3f461e78497a2def7663ca3a6a6cf3df63c"
          if git merge-base --is-ancestor "$legacy_sha" HEAD 2>/dev/null; then
            echo "Legacy history is already connected."
            exit 0
          fi

          git merge legacy/main \
            --strategy=ours \
            --allow-unrelated-histories \
            -m "chore: preserve history of legacy momcafe_bitcoin repository"
          git push origin HEAD:main
