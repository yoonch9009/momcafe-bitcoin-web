name: incremental-collect-and-deploy

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify collector contracts
        run: python -m unittest discover -s tests -v

      - name: Collect recent observations
        run: python scrape.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and verify web app
        env:
          NEXT_PUBLIC_BASE_PATH: /momcafe-bitcoin-web
        run: |
          npm ci
          npm run check

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update incremental snapshot"
            git push
          else
            echo "No snapshot change."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
